<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title> Jugo - AI tool </title>
  <link rel="icon" href="J-icon.png">

  <style>
    :root{
      --bg:#ffffff;
      --accent:#ff8c00;
      --accent-2:#13196B;
      --muted:#555;
      --glass:rgba(0,0,0,0.05);
      --radius:14px;
      --max-width:1100px;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial;
    }

    body{
      margin:0;
      background:#ffffff;
      color:#13196B;
    }

    a{color:var(--accent-2); text-decoration:none}
    img{display:block; max-width:100%}

    .container{
      max-width:var(--max-width);
      margin:0 auto;
      padding:30px 20px;
    }

    header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:8px 0;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:14px;
    }

    .logo img{
      width:180px;
      height:auto;
    }

    nav{
      display:flex;
      gap:14px;
      font-weight:600;
    }

    nav a{
      padding:8px 12px;
      border-radius:8px;
      color:#13196B;
    }

    nav a:hover{
      background:var(--glass);
    }

    .upload-box{
      margin:60px auto 0;
      max-width:600px;
      background:#f6f7fb;
      border:2px dashed #13196B;
      padding:40px;
      text-align:center;
      border-radius:var(--radius);
    }

    .upload-box h2{
      margin-top:0;
      margin-bottom:20px;
      font-size:26px;
      color:#13196B;
    }

    .drop-zone {
      border: 2px dashed var(--accent-2);
      background: #ffffff;
      padding: 40px;
      border-radius: 14px;
      cursor: pointer;
      color: var(--accent-2);
      margin-bottom: 20px;
      transition: 0.25s;
    }

    .drop-zone.dragover {
      background: #eaf0ff;
      border-color: var(--accent);
    }

    .btn-upload, .btn-photo{
      margin-top:15px;
      padding:12px 24px;
      background:var(--accent);
      color:white;
      border:none;
      border-radius:10px;
      font-weight:700;
      cursor:pointer;
      font-size:16px;
    }

    .btn-upload:hover, .btn-photo:hover{
      opacity:0.9;
    }

    #fileName {
      margin-top: 10px;
      font-size: 14px;
      color: #555;
    }

    .light-hint {
      color: #9e9e9e;
      font-size: 0.9em;
      margin-top: 4px;
    }

    /* Webcam Modal */
    #webcamModal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    #webcamModal .box {
      background:white;
      padding:20px;
      border-radius:14px;
      text-align:center;
    }

    #webcamVideo {
      width:400px;
      border-radius:10px;
    }

  </style>
</head>

<body>

<div class="container">
  
  <header>
    <div class="brand">
        <a href="Website_homepage.html" class="logo">
            <img src="Logo_jugo.png" alt="Jugo logo">
        </a>
    </div>

    <nav>
      <a href="Website_homepage.html">Home</a>
      <a href="#home">Tool</a>
    </nav>
  </header>

  <div class="upload-box">
    <h2>Upload Your Dashboard</h2>

    <div id="dropZone" class="drop-zone">
      <p>Click or Drag & Drop your dashboard image here</p>
    </div>

    <p class="light-hint">Make sure the dashboard is clearly visible, well lit, and fills the entire screen.
    Avoid reflections, glare, and empty white space around the dashboard.</p>

    <input type="file" id="fileInput" accept="image/*" style="display:none;">
    <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none;">

    <div id="fileName"></div>

    <button class="btn-photo" onclick="openCamera()">Take Photo</button>
    <button class="btn-upload" onclick="uploadFile()">Upload</button>
  </div>
</div>

<!-- Webcam Modal -->
<div id="webcamModal">
  <div class="box">
    <video id="webcamVideo" autoplay></video><br><br>
    <button onclick="captureDesktopPhoto()">Capture Photo</button>
    <button onclick="closeWebcam()">Cancel</button>
  </div>
</div>
<script>
const dropZone = document.getElementById("dropZone");
const fileInput = document.getElementById("fileInput");
const cameraInput = document.getElementById("cameraInput");
const fileNameDisplay = document.getElementById("fileName");

const webcamModal = document.getElementById("webcamModal");
const webcamVideo = document.getElementById("webcamVideo");

let selectedFile = null;
let webcamStream = null;

/* CLICK TO OPEN FILE PICKER */
dropZone.addEventListener("click", () => fileInput.click());

/* FILE PICKER */
fileInput.addEventListener("change", () => {
  if (fileInput.files.length) {
    selectedFile = fileInput.files[0];
    fileNameDisplay.textContent = selectedFile.name;
  }
});

/* DRAG & DROP */
dropZone.addEventListener("dragover", e => {
  e.preventDefault();
  dropZone.classList.add("dragover");
});

dropZone.addEventListener("dragleave", () => dropZone.classList.remove("dragover"));

dropZone.addEventListener("drop", e => {
  e.preventDefault();
  dropZone.classList.remove("dragover");
  const file = e.dataTransfer.files[0];
  if (!file || !file.type.startsWith("image/")) {
    alert("Please drop a valid image file.");
    return;
  }
  selectedFile = file;
  fileNameDisplay.textContent = file.name;
});

/* CAMERA INPUT (MOBILE NATIVE CAPTURE) */
cameraInput.addEventListener("change", () => {
  if (cameraInput.files.length) {
    selectedFile = cameraInput.files[0];
    fileNameDisplay.textContent = selectedFile.name || "Photo captured";
  }
});

/* OPEN CAMERA: mobile = native, desktop = webcam modal */
function openCamera() {
  if (/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)) {
    // Mobile – use native camera via file input
    cameraInput.click();
  } else {
    // Desktop – open webcam modal
    webcamModal.style.display = "flex";
    navigator.mediaDevices.getUserMedia({ video: true }).then(stream => {
      webcamStream = stream;
      webcamVideo.srcObject = stream;
    }).catch(err => {
      console.error("Error accessing webcam:", err);
      alert("Unable to access webcam.");
    });
  }
}

/* CAPTURE PHOTO FROM DESKTOP WEBCAM */
function captureDesktopPhoto() {
  const canvas = document.createElement("canvas");
  canvas.width = webcamVideo.videoWidth;
  canvas.height = webcamVideo.videoHeight;
  canvas.getContext("2d").drawImage(webcamVideo, 0, 0);

  canvas.toBlob(blob => {
    selectedFile = new File([blob], "webcam_photo.png", { type: "image/png" });
    fileNameDisplay.textContent = selectedFile.name;
    closeWebcam();
  });
}

/* CLOSE WEBCAM MODAL */
function closeWebcam() {
  webcamModal.style.display = "none";
  if (webcamStream) {
    webcamStream.getTracks().forEach(t => t.stop());
    webcamStream = null;
  }
}

/* UPLOAD BUTTON: camera + API + redirect */
async function uploadFile() {
  if (!selectedFile) {
    alert("Please select or capture an image first.");
    return;
  }

  // Show loading state (expects a button with class "btn-upload")
  const uploadBtn = document.querySelector('.btn-upload');
  let originalText = '';
  if (uploadBtn) {
    originalText = uploadBtn.textContent;
    uploadBtn.textContent = 'Uploading...';
    uploadBtn.disabled = true;
  }

  try {
    // 1. Send file to backend
    const formData = new FormData();
    formData.append("file", selectedFile);

    const isLocal = window.location.hostname === 'localhost' || 
                          window.location.hostname === '127.0.0.1';
    // let API_URL
    // if (isLocalhost) {
    //   API_URL = 'http://127.0.0.1:3000/api/predict';
    // } else if (window.location.hostname === '127.0.0.1' || window.location.hostname === '0.0.0.0') {
    //   API_URL = 'https://127.0.0.1:8000/api/predict';
    // } else {
    //   API_URL = 'https://ibcs-6aig.onrender.com/api/predict';
    // }
    
    const API_URL = isLocal
      ? 'http://127.0.0.1:8000/api/predict'          // local FastAPI
      : 'https://ibcs-6aig.onrender.com/api/predict'; // Render

    console.log('Uploading to:', API_URL);



    const res = await fetch(API_URL, {
      method: "POST",
      body: formData
    });

    if (!res.ok) {
      const errorText = await res.text();
      console.error('Server error:', errorText);
      throw new Error(`Server responded with ${res.status}: ${errorText}`);
    }

    const data = await res.json();
    console.log('Upload successful:', data);

    // 2. Store image + result, then redirect
    const reader = new FileReader();
    reader.onload = function(e) {
      sessionStorage.setItem("uploadedImage", e.target.result);
      sessionStorage.setItem("modelResult", JSON.stringify(data));
      window.location.href = "Website_feedback.html";
    };

    reader.onerror = function() {
      throw new Error("Failed to read image file");
    };

    reader.readAsDataURL(selectedFile);

  } catch (err) {
    console.error("Upload error:", err);

    if (err.message.includes("Failed to fetch") || err.message.includes("NetworkError")) {
      alert("Cannot connect to server. Please check:\n1. Backend server is running\n2. Correct URL is configured\n3. No CORS issues");
    } else {
      alert("Upload failed: " + err.message);
    }

    // Reset button state
    if (uploadBtn) {
      uploadBtn.textContent = originalText;
      uploadBtn.disabled = false;
    }
  }
}
</script>


</body>
</html>
