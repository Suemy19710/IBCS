<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title> Jugo - AI tool </title>
  <link rel="icon" href="J-icon.png">

  <style>
    :root{
      --bg:#ffffff;
      --accent:#ff8c00;
      --accent-2:#13196B;
      --muted:#555;
      --glass:rgba(0,0,0,0.05);
      --radius:14px;
      --max-width:1100px;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial;
    }

    body{
      margin:0;
      background:#ffffff;
      color:#13196B;
    }

    a{color:var(--accent-2); text-decoration:none}
    img{display:block; max-width:100%}

    .container{
      max-width:var(--max-width);
      margin:0 auto;
      padding:30px 20px;
    }

    header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:8px 0;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:14px;
    }

    .logo img{
      width:180px;
      height:auto;
    }

    nav{
      display:flex;
      gap:14px;
      font-weight:600;
    }

    nav a{
      padding:8px 12px;
      border-radius:8px;
      color:#13196B;
    }

    nav a:hover{
      background:var(--glass);
    }

    .upload-box{
      margin:60px auto 0;
      max-width:600px;
      background:#f6f7fb;
      border:2px dashed #13196B;
      padding:40px;
      text-align:center;
      border-radius:var(--radius);
    }

    .upload-box h2{
      margin-top:0;
      margin-bottom:20px;
      font-size:26px;
      color:#13196B;
    }

    .drop-zone {
      border: 2px dashed var(--accent-2);
      background: #ffffff;
      padding: 40px;
      border-radius: 14px;
      cursor: pointer;
      color: var(--accent-2);
      margin-bottom: 20px;
      transition: 0.25s;
    }

    .drop-zone.dragover {
      background: #eaf0ff;
      border-color: var(--accent);
    }

    .btn-upload, .btn-photo{
      margin-top:15px;
      padding:12px 24px;
      background:var(--accent);
      color:white;
      border:none;
      border-radius:10px;
      font-weight:700;
      cursor:pointer;
      font-size:16px;
    }

    .btn-upload:hover, .btn-photo:hover{
      opacity:0.9;
    }

    #fileName {
      margin-top: 10px;
      font-size: 14px;
      color: #555;
    }

    .light-hint {
      color: #9e9e9e;
      font-size: 0.9em;
      margin-top: 4px;
    }

    /* Webcam Modal */
    #webcamModal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    #webcamModal .box {
      background:white;
      padding:20px;
      border-radius:14px;
      text-align:center;
    }

    #webcamVideo {
      width:400px;
      border-radius:10px;
    }

  </style>
</head>

<body>

<div class="container">
  
  <header>
    <div class="brand">
        <a href="Website_homepage.html" class="logo">
            <img src="Logo_jugo.png" alt="Jugo logo">
        </a>
    </div>

    <nav>
      <a href="Website_homepage.html">Home</a>
      <a href="#home">Tool</a>
    </nav>
  </header>

  <div class="upload-box">
    <h2>Upload Your Dashboard</h2>

    <div id="dropZone" class="drop-zone">
      <p>Click or Drag & Drop your dashboard image here</p>
    </div>

    <p class="light-hint">Make sure the dashboard is clearly visible, well lit, and fills the entire screen.
    Avoid reflections, glare, and empty white space around the dashboard.</p>

    <input type="file" id="fileInput" accept="image/*" style="display:none;">
    <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none;">

    <div id="fileName"></div>

    <button class="btn-photo" onclick="openCamera()">Take Photo</button>
    <button class="btn-upload" onclick="uploadFile()">Upload</button>
  </div>
</div>

<!-- Webcam Modal -->
<div id="webcamModal">
  <div class="box">
    <video id="webcamVideo" autoplay></video><br><br>
    <button onclick="captureDesktopPhoto()">Capture Photo</button>
    <button onclick="closeWebcam()">Cancel</button>
  </div>
</div>
<script>
const dropZone = document.getElementById("dropZone");
const fileInput = document.getElementById("fileInput");
const cameraInput = document.getElementById("cameraInput");
const fileNameDisplay = document.getElementById("fileName");
const webcamModal = document.getElementById("webcamModal");
const webcamVideo = document.getElementById("webcamVideo");

let selectedFile = null;
let webcamStream = null;

/* FILE SELECTION */
dropZone.addEventListener("click", () => fileInput.click());
fileInput.addEventListener("change", () => handleFileSelect(fileInput.files[0]));
cameraInput.addEventListener("change", () => handleFileSelect(cameraInput.files[0]));

function handleFileSelect(file) {
    if (file) {
        selectedFile = file;
        fileNameDisplay.textContent = file.name || "Photo captured";
    }
}

/* OPEN CAMERA: Logic for Mobile vs Desktop */
function openCamera() {
    if (/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)) {
        cameraInput.click(); // Uses phone's native high-res camera
    } else {
        webcamModal.style.display = "flex";
        navigator.mediaDevices.getUserMedia({ video: true }).then(stream => {
            webcamStream = stream;
            webcamVideo.srcObject = stream;
        }).catch(err => {
            alert("Unable to access webcam.");
        });
    }
}

/* DESKTOP WEBCAM CAPTURE */
function captureDesktopPhoto() {
    const canvas = document.createElement("canvas");
    canvas.width = webcamVideo.videoWidth;
    canvas.height = webcamVideo.videoHeight;
    canvas.getContext("2d").drawImage(webcamVideo, 0, 0);
    canvas.toBlob(blob => {
        selectedFile = new File([blob], "webcam_photo.jpg", { type: "image/jpeg" });
        fileNameDisplay.textContent = "Webcam photo ready";
        closeWebcam();
    }, "image/jpeg", 0.8);
}

function closeWebcam() {
    webcamModal.style.display = "none";
    if (webcamStream) {
        webcamStream.getTracks().forEach(t => t.stop());
        webcamStream = null;
    }
}

/* --- THE COMPRESSION ENGINE (Fixes the Mobile "Upload Fail") --- */
async function compressImage(file) {
    return new Promise((resolve) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (e) => {
            const img = new Image();
            img.src = e.target.result;
            img.onload = () => {
                const canvas = document.createElement('canvas');
                const MAX_WIDTH = 1024; // Good balance for YOLO/MobileNet
                let width = img.width;
                let height = img.height;

                if (width > MAX_WIDTH) {
                    height *= MAX_WIDTH / width;
                    width = MAX_WIDTH;
                }

                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);
                canvas.toBlob((blob) => {
                    resolve(new File([blob], file.name, { type: "image/jpeg" }));
                }, "image/jpeg", 0.7);
            };
        };
    });
}

/* UPLOAD LOGIC */
async function uploadFile() {
    if (!selectedFile) {
        alert("Please select or capture an image first.");
        return;
    }

    const uploadBtn = document.querySelector('.btn-upload');
    const originalText = uploadBtn.textContent;
    uploadBtn.textContent = 'Processing...';
    uploadBtn.disabled = true;

    try {
        // STEP 1: Compress (Especially important for mobile photos!)
        const processedFile = await compressImage(selectedFile);
        
        const formData = new FormData();
        formData.append("file", processedFile);

        const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
        const API_URL = isLocal ? 'http://127.0.0.1:8000/api/predict' : 'https://ibcs-6aig.onrender.com/api/predict';

        uploadBtn.textContent = 'Analyzing...';
        
        const res = await fetch(API_URL, {
            method: "POST",
            body: formData
        });

        if (!res.ok) throw new Error(`Server Error: ${res.status}`);

        const data = await res.json();

        // STEP 2: Save and Redirect
        const reader = new FileReader();
        reader.onload = function(e) {
            sessionStorage.setItem("uploadedImage", e.target.result);
            sessionStorage.setItem("modelResult", JSON.stringify(data));
            window.location.href = "Website_feedback.html";
        };
        reader.readAsDataURL(processedFile);

    } catch (err) {
        console.error(err);
        alert("Upload failed. The image might be too large or the server is busy.");
        uploadBtn.textContent = originalText;
        uploadBtn.disabled = false;
    }
}
</script>

</body>
</html>
