<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Jugo - AI tool</title>
  <link rel="icon" href="J-icon.png">

  <style>
    :root{
      --bg:#ffffff;
      --accent:#ff8c00;
      --accent-2:#13196B;
      --muted:#555;
      --glass:rgba(0,0,0,0.05);
      --radius:14px;
      --max-width:1100px;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial;
    }

    body{
      margin:0;
      background:#ffffff;
      color:#ff8c00;
    }

    a{color:var(--accent-2); text-decoration:none}
    img{display:block; max-width:100%}

    .container{
      max-width:var(--max-width);
      margin:0 auto;
      padding:30px 20px;
    }

    header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:8px 0;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:14px;
    }

    .logo img{
      width:180px;
      height:auto;
    }

    nav{
      display:flex;
      gap:14px;
      font-weight:600;
    }

    nav a{
      padding:8px 12px;
      border-radius:8px;
      color:#13196B;
    }

    nav a:hover{
      background:var(--glass);
    }

    .display-wrapper {
      display: flex;
      gap: 20px;
      margin-top: 30px;
      align-items: stretch;
    }

    .image-box,
    .text-box {
      flex: 1;
      border: 3px solid var(--accent-2);
      border-radius: 14px;
      display: flex;
      padding: 25px;
    }

    .image-box {
      background: var(--accent-2);
      justify-content: center;
      align-items: center;
    }

    .image-box img {
      max-width: 100%;
      max-height: 100%;
      border-radius: 10px;
      object-fit: contain;
    }

    .text-box {
      background: #ffffff;
      color: var(--accent-2);
      font-size: 20px;
      line-height: 1.6;
      flex-direction: column;
      gap: 12px;
      overflow-wrap: break-word;
    }

    @media (max-width: 768px) {
      .display-wrapper {
        flex-direction: column;
      }
    }

    .back-button-wrapper {
      margin-top: 40px;
      display: flex;
      justify-content: center;
    }

    .back-home-btn {
      padding: 12px 24px;
      font-size: 18px;
      font-weight: 600;
      color: white;
      background: var(--accent-2);
      border-radius: 10px;
      cursor: pointer;
      transition: 0.2s;
      text-decoration: none;
    }

    .back-home-btn:hover {
      background: var(--accent);
      transform: scale(1.05);
    }

    /* ✅ CLICKABLE FEEDBACK LINKS */
    .feedback-link {
      color: #3a77ff;
      font-weight: 600;
      text-decoration: underline;
      cursor: pointer;
    }

    .feedback-link:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

<div class="container">

<header>
  <div class="brand">
    <a href="Website_homepage.html" class="logo">
      <img src="Logo_jugo.png" alt="Jugo logo">
    </a>
  </div>

  <nav>
    <a href="Website_homepage.html" class="confirm-leave">Home</a>
    <a href="Website_upload.html" class="confirm-leave">Tool</a>
    <a href="#">Result</a>
  </nav>
</header>

<h2>Uploaded Image</h2>
<div class="display-wrapper">
  <div class="image-box" id="imageContainer"></div>
  <div class="text-box">Feedback for client</div>
</div>

<script>
/* ---------- LINKIFY FUNCTION ---------- */
function linkify(text) {
  const urlRegex = /(https?:\/\/[^\s]+)/g;
  return text.replace(urlRegex, url =>
    `<a href="${url}" 
        target="_blank" 
        rel="noopener noreferrer"
        class="feedback-link">${url}</a>`
  );
}

/* ---------- LOAD IMAGE ---------- */
const imgData = sessionStorage.getItem("uploadedImage");

if (imgData) {
  const imgContainer = document.getElementById("imageContainer");
  const img = document.createElement("img");
  img.src = imgData;
  img.alt = "Uploaded Image";
  imgContainer.appendChild(img);
} else {
  document.getElementById("imageContainer").textContent = "No image found.";
}

/* ---------- LOAD MODEL RESULT ---------- */
const resultRaw = sessionStorage.getItem("modelResult");
const textBox = document.querySelector(".text-box");

if (resultRaw) {
  const result = JSON.parse(resultRaw);

  const fbHTML = Array.isArray(result.feedback)
    ? result.feedback.map(line => `<p>${linkify(line)}</p>`).join("")
    : `<p>${linkify(result.feedback)}</p>`;

  textBox.innerHTML = `
    <div>
      <p><strong>Status:</strong> ${result.label}</p>
      <p><strong>Detected axis issues:</strong> ${result.rule}</p>
      <h4>IBCS Feedback:</h4>
      ${fbHTML}
    </div>
  `;
} else {
  textBox.innerHTML = `<p>No model results found.</p>`;
}
</script>

<div class="back-button-wrapper">
  <a href="Website_homepage.html" class="back-home-btn confirm-leave">
    Back to Homepage
  </a>
</div>

<script>
document.querySelectorAll(".confirm-leave").forEach(link => {
  link.addEventListener("click", function(e) {
    e.preventDefault();
    const confirmLeave = confirm(
      "Are you sure you want to leave the site? Your progress will be lost."
    );
    if (confirmLeave) window.location.href = this.href;
  });
});
</script>

</div>
</body>
</html>
